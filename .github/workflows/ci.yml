name: Metal-Uriel CI (Seguridad, Build Vite, Sintaxis y Pruebas)

on:
  push:
    branches: [ main, "refactor/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Verificación de sintaxis Backend (index.js, headless.js, lib/, src/)
        run: npm run check

      - name: Build de producción Frontend Offline (Vite + React 18 + Tailwind CSS)
        run: npm run build

      - name: Suite de pruebas automatizadas (RBAC, HMAC, CORS, Headless, CURP, Guardrails, RAM GC)
        run: npm test

      - name: Escaneo anti-fuga de secretos en archivos versionados
        run: |
          if git ls-files | grep -E '^\.env$'; then
            echo "ERROR CRÍTICO: El archivo .env está versionado en Git."
            exit 1
          fi
          if git grep -nE '(AIzaSy[0-9A-Za-z_-]{30,}|sk-proj-[0-9A-Za-z_-]{20,}|sk-ant-[0-9A-Za-z_-]{20,}|EAA[A-Za-z0-9]{60,})' -- ':!tests/*' ':!README.md'; then
            echo "ERROR CRÍTICO: Posible API Key real detectada en el repositorio."
            exit 1
          fi
          echo "Escaneo de secretos limpio."
